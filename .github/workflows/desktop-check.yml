name: Desktop checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Build Windows desktop binary
        if: runner.os == 'Windows'
        run: pnpm tauri build --no-bundle
      - name: Build macOS application
        if: runner.os == 'macOS'
        run: pnpm tauri build --bundles app
