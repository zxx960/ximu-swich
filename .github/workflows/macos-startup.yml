name: Verify packaged macOS startup
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Packaging workflow run containing the app archive
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ximuai-macos-universal
          path: original-package
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Launch actual packaged application
        id: smoke
        continue-on-error: true
        run: python3 scripts/macos-startup-smoke.py original-package/ximuai-macos-universal.app.tar.gz
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ximuai-startup-${{ matrix.os }}
          path: startup-diagnostics
          if-no-files-found: error
          retention-days: 7
      - name: Check startup result
        if: steps.smoke.outcome == 'failure'
        run: exit 1
